<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="icon" type="image/png" href="logo.png"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>Prodigy Command</title><style>
:root{--g:#D4AF37;--bg:#0a0a0a;--c:#151515;--t:#eee}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:system-ui,sans-serif}
header{border-bottom:2px solid var(--g);padding:16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.logo{height:56px;width:auto;display:block}h1{margin:0;color:var(--g);font-size:22px}.sub{font-size:13px;color:#bbb}.sub a{color:var(--g)}
.links{display:flex;flex-wrap:wrap;gap:8px;padding:12px 16px;border-bottom:1px solid #333}.links a{color:#000;background:var(--g);padding:7px 12px;border-radius:20px;text-decoration:none;font-weight:600;font-size:14px}
.day{padding:16px;text-align:center}.day h2{color:var(--g);margin:0 0 10px}.tog button,.ctl button{background:none;border:1px solid var(--g);color:var(--g);padding:8px 16px;border-radius:8px;font-size:15px;margin:3px;cursor:pointer}.tog button.on,.ctl button.p{background:var(--g);color:#000}
.grid{display:grid;grid-template-columns:2fr 1fr;gap:16px;padding:0 16px 30px}@media(max-width:760px){.grid{grid-template-columns:1fr}}
.box{background:var(--c);border:1px solid #333;border-radius:12px;padding:16px}.box h3{color:var(--g);margin-top:0;letter-spacing:1px}
.card{font-size:22px;line-height:1.4;padding:20px;border:2px solid var(--g);border-radius:12px;min-height:130px}.n{color:var(--g);font-size:14px}
ul{list-style:none;padding:0;margin:0}li{padding:10px 4px;border-bottom:1px solid #2a2a2a;display:flex;gap:10px}li.d span{text-decoration:line-through;color:#666}input{accent-color:var(--g);width:20px;height:20px;flex:none}
.note{padding:10px;border-left:3px solid var(--g);margin-bottom:10px;background:#1c1a12}.prog{color:#bbb;margin:8px 0}
.myday{margin:0 16px 16px;border:2px solid var(--g);border-radius:12px;padding:14px 16px;background:var(--c)}.myday h3{color:var(--g);margin:0 0 8px;letter-spacing:1px;display:flex;justify-content:space-between;align-items:center}.myday h3 a{font-size:13px;color:var(--g)}
.ev{display:flex;gap:14px;padding:8px 10px;border-left:3px solid #444;margin:4px 0}.ev b{color:var(--g);min-width:150px}.ev.past{opacity:.45}.ev.next{border-left-color:var(--g);background:#1c1a12}.ev.next b:after{content:" · NEXT UP";font-size:12px}
</style></head><body>
<script>
/* ===== EDIT DAILY: date, tasks, notifications ===== */
const DAY="Wednesday, October 28, 2026", KEY="pc-2026-10-28";
const TASKS=[
"HIGH PRIORITY: Larry Pinnette, premium changed. Review the change and fix it with the carrier and Larry.",
"Kathy Trujillo (KCL term): app was withdrawn. Find out why, and rewrite or book a call with her.",
"Mary Bell (Foresters Smart UL): withdrawn after the MOO denial. Confirm she still wants coverage and pick the next carrier.",
"Make sure new leads are hit immediately: check the 350+ new leads and confirm the VA starts.",
"Fill the calendar: lock in Rita Bingham Smiley ($150k quote for her and Bueford), John Delawder Fri 10/30 1 PM, Pascal Clark Mon 11/2 9:30, then book from the new leads.",
"Follow up on last week's appointments: Donna Griggs, Merrill Leroy Holt, Gerald Failing, Jennifer Boles, Sedgie Davis, Rick Lambert, and Eric Hines' banking.",
"Reply to the team: Brandon Allan, Jake Payne's email, Foresters PINs for Bryan and Brandon, and the Dylan recoup thread.",
"Rewrite quotes: Mary Bell, Charlene Nichols, Gilbert Rosalez, Mike Dunn.",
"Dial Facebook and mailer leads in EZ PZ.",
"Experian: review the credit report with George, and apply to Navy Federal first."
];
/* MY DAY: [start "HH:MM" 24h, end, title] — America/Denver, from Google Calendar */
const CAL_DATE="2026-10-28";
const CALENDAR=[
["08:30","08:40","PNCL morning production kickoff"],
["09:00","09:15","Issue Paid Huddle (with Mandy)"],
["10:01","10:31","Rita Bingham Smiley - Insurance consultation"],
["13:30","14:30","Policy follow-up"]
];
const NOTES=[
"Rita Bingham Smiley appointment: Wed 10/28, 10:01 AM",
"Calendar nearly empty 10/28 to 11/3 (only 2 new appointments)",
"Wed/Thu are PNCL days, kids after work",
"Foresters now requires agent PINs",
"Discover it Secured applications are paused"
];
const LINKS=[["Foresters","https://www.foresters.com/"],["Mutual of Omaha (SPA)","https://producer.mutualofomaha.com/"],["Transamerica","https://secure.transamerica.com"],["Ethos","https://agents.ethoslife.com/"],["Kansas City Life","https://www.kclife.com/"],["Lead Supply","https://app.gohighlevel.com"],["Google Calendar","https://calendar.google.com"]];
/* ===== end edit block ===== */
</script>
<header><img class="logo" src="logo.png" alt="Prodigy Life"><div><h1>PRODIGY LIFE, LLC</h1><div class="sub">Justin Virgin · Agency Owner / Producer · <a href="tel:8014723455">801-472-3455</a> · <a href="mailto:jv@thepncl.com">jv@thepncl.com</a> · NPN 22089462</div></div></header>
<nav class="links" id="links"></nav>
<section class="day"><h2 id="day"></h2><div class="tog"><button id="bf" class="on">Focus</button><button id="ba">All tasks</button></div><div class="prog" id="prog"></div></section>
<section class="myday"><h3>MY DAY <a href="https://calendar.google.com/calendar/u/0/r/day/2026/10/28" target="_blank" rel="noopener">Open Google Calendar ↗</a></h3><div id="cal"></div></section>
<main class="grid"><section class="box"><h3>TO DO</h3><div id="todo"></div></section><aside class="box"><h3>IMPORTANT NOTIFICATIONS</h3><div id="notes"></div></aside></main>
<script>
let done=JSON.parse(localStorage.getItem(KEY)||"[]"),mode="f",i=0;const $=id=>document.getElementById(id);
const save=()=>localStorage.setItem(KEY,JSON.stringify(done));
$("day").textContent=DAY;$("links").innerHTML=LINKS.map(l=>`<a href="${l[1]}" target="_blank" rel="noopener">${l[0]}</a>`).join("");
$("notes").innerHTML=NOTES.map(n=>`<div class="note">${n}</div>`).join("");
(function(){const f=t=>{let[h,m]=t.split(":").map(Number);return((h+11)%12+1)+":"+String(m).padStart(2,"0")+(h<12?" AM":" PM")};
const now=new Date(),today=now.toLocaleDateString("en-CA",{timeZone:"America/Denver"}),hm=now.toLocaleTimeString("en-GB",{timeZone:"America/Denver",hour:"2-digit",minute:"2-digit"});
let nx=CALENDAR.findIndex(e=>today<CAL_DATE||(today==CAL_DATE&&e[1]>hm));
$("cal").innerHTML=CALENDAR.length?CALENDAR.map((e,k)=>`<div class="ev ${k==nx?'next':(today>CAL_DATE||(today==CAL_DATE&&e[1]<=hm))?'past':''}"><b>${f(e[0])} – ${f(e[1])}</b><span>${e[2]}</span></div>`).join(""):"<div class='ev'>No appointments</div>"})();
function nextOpen(f){for(let k=f;k<TASKS.length;k++)if(!done.includes(k))return k;return -1}
function render(){$("prog").textContent=`${done.length} of ${TASKS.length} done`;$("bf").className=mode=="f"?"on":"";$("ba").className=mode=="a"?"on":"";
if(mode=="f"){if(i<0||i>=TASKS.length||done.includes(i))i=nextOpen(0);
$("todo").innerHTML=i<0?`<div class="card">🏆 All done. Great work.</div><div class="ctl"><button onclick="done=[];save();i=0;render()">Start over</button></div>`:
`<div class="card"><div class="n">Task ${i+1} of ${TASKS.length}</div>${TASKS[i]}</div><div class="ctl"><button onclick="back()">Back</button><button class="p" onclick="markDone()">Done ✓</button><button onclick="skip()">Next</button></div>`}
else $("todo").innerHTML="<ul>"+TASKS.map((t,k)=>`<li class="${done.includes(k)?'d':''}"><input type="checkbox" ${done.includes(k)?'checked':''} onchange="tog(${k})"><span>${k+1}. ${t}</span></li>`).join("")+"</ul>"}
function markDone(){if(!done.includes(i))done.push(i);save();i=nextOpen(i);if(i<0)i=nextOpen(0);render()}
function skip(){let k=nextOpen(i+1);i=k<0?nextOpen(0):k;render()}
function back(){for(let k=i-1;k>=0;k--)if(!done.includes(k)){i=k;break}render()}
function tog(k){done=done.includes(k)?done.filter(x=>x!=k):[...done,k];save();render()}
$("bf").onclick=()=>{mode="f";render()};$("ba").onclick=()=>{mode="a";render()};render();
</script><div id="talk" style="max-width:1200px;margin:16px auto;padding:16px;border:1px solid #D4AF37;border-radius:14px;background:#141414">
<div style="color:#D4AF37;font-weight:700;letter-spacing:1px;margin-bottom:8px">TALK TO GEORGE</div>
<textarea id="gmsg" placeholder="Type your update or question..." style="width:100%;min-height:70px;background:#0b0b0b;color:#fff;border:1px solid #555;border-radius:10px;padding:10px;font:inherit"></textarea>
<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px">
<button onclick="(async()=>{const t=document.getElementById('gmsg').value;try{await navigator.clipboard.writeText(t)}catch(e){};location.href='grokbot://app/v1/agent?id=37a6cabc-44f2-4cb4-814f-91f175e80d5d'})()" style="background:#D4AF37;color:#000;border:0;border-radius:10px;padding:8px 14px;font-weight:700">Copy &amp; open George</button>
</div><div style="color:#999;font-size:12px;margin-top:6px">Copies your note and opens George's chat. Paste it there and hit send.</div></div>
</body></html>
